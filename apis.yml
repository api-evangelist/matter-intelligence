aid: matter-intelligence
name: Matter Intelligence
description: >-
  Matter Intelligence is a California-based remote sensing and physical-AI company founded in 2024
  by former NASA Jet Propulsion Laboratory engineers Vishnu Sridhar and Thomas Chrien with former
  Caltech scientist Nathan Stein. The company builds ultraspectral imaging sensors that capture
  roughly 2,000 spectral bands from deep ultraviolet through thermal infrared — enough to read the
  molecular chemistry of a surface rather than only its color — and pairs them with Large Geospatial
  Models that reason over that data. Its sensors are designed for satellites, aircraft, drones and
  robots, and its first satellite, EARTH-1, is intended to deliver sub-meter hyperspectral and
  thermal imaging and to build a global encyclopedia of Earth's material composition. Target
  applications named on its site include mining and mineral exploration, agriculture, insurance and
  risk, infrastructure monitoring, emissions and methane detection, and defense ISR. The company
  emerged from stealth in October 2024 with a $12M seed round led by Lowercarbon Capital, with
  Toyota Ventures, Pear VC, E2MC and Mark Cuban participating. As of this profile it is pre-launch
  and pre-product: matter.com is a marketing site with an Early Access request form, and Matter
  Intelligence publishes no public API, developer portal, documentation, SDK or machine-readable
  contract of any kind.
